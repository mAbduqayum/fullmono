# Git hooks, installed by `just setup` (`lefthook install`).
# Each job sees only the staged files under its root, and runs in that folder.

pre-commit:
  parallel: true
  jobs:
    - name: api format
      root: apps/api/
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    - name: api lint
      root: apps/api/
      glob: "*.go"
      run: golangci-lint run

    - name: web format
      root: apps/web/
      glob: "*.{ts,tsx,json,css}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true

    - name: web lint
      root: apps/web/
      glob: "*.{ts,tsx}"
      run: bunx oxlint {staged_files}

    - name: e2e format
      root: e2e/
      glob: "*.{ts,json}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true

    - name: e2e lint
      root: e2e/
      glob: "*.ts"
      run: bunx oxlint {staged_files}

commit-msg:
  jobs:
    - name: conventional commit
      run: |
        if ! head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'; then
          echo "Start the message with a Conventional Commits type, like 'feat: add link expiry' or 'fix(api): …'"
          exit 1
        fi

# Only the unit tests: a push shouldn't wait on Docker. CI runs the rest.
pre-push:
  jobs:
    - name: test
      run: just test
