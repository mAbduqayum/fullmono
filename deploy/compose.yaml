# Production, on the server: the images CI pushed, never a build.
# The deploy workflow copies this file to the server, records the commit to
# run as TAG in the .env beside it, which holds POSTGRES_*, SITE_ADDRESS (the
# domain) and JWT_SECRET, and runs
#   docker compose pull && docker compose up --detach --wait
# docs/operations.md has the rest: the first deploy, rollbacks, backups.
name: fullmono

# Where each container's output goes, which `docker compose logs` reads.
# Docker keeps all of it by default, until the disk fills: here, the last
# three files of 10 MB each.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-api: &api
  image: ghcr.io/mabduqayum/fullmono-api:${TAG:?set TAG in the server's .env}
  logging: *logging
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the server's .env}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # A dump of the database when it starts and every day after, into
  # backups/ beside this file, each day's replacing that day's, two weeks
  # kept. They share the database's disk, so copy them off the server too.
  backup:
    # db's image, so pg_dump is the server's own version.
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      # pg_dump reads these instead of flags.
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    entrypoint: [sh, -c]
    # $$ is a $ that compose leaves to the shell. A dump that fails halfway
    # stays a .partial, so every .dump is a whole one.
    command:
      - |
        while true; do
          file=/backups/$$(date +%F).dump
          pg_dump --format=custom --file="$$file.partial" && mv "$$file.partial" "$$file" && echo "backed up to $$file"
          find /backups -name '*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  migrate:
    <<: *api
    command: [migrate]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/mabduqayum/fullmono-web:${TAG:?set TAG in the server's .env}
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp # HTTP/3
    volumes:
      # Caddy's certificates: lose them and it asks Let's Encrypt again on every restart.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
