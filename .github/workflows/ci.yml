# Checks every pull request, and every push to main before release.yml ships it.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # A monorepo's change usually touches one app: check only what changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes with git, so the token is left out of .git/config, where a
          # later step, or an artifact that uploads the folder, could read it.
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - apps/api/**
              - scripts/check-migrations.sh
              - mise.toml
              - .github/workflows/ci.yml
            web:
              - apps/web/**
              # The web's api types are generated from it.
              - apps/api/openapi.yaml
              - mise.toml
              - .github/workflows/ci.yml
            e2e:
              - apps/**
              - e2e/**
              - compose.yaml
              - justfile
              - mise.toml
              - .github/workflows/ci.yml
            workflows:
              - .github/**
              - mise.toml

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # A real Postgres beside the job, for the integration tests: they skip
    # without TEST_DATABASE_URL, so this one `go test` runs both kinds.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise.toml's versions, as on a laptop; only the tools this job runs.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: go just golangci-lint
      # Go's downloaded modules and build cache, and golangci-lint's results:
      # what go.sum hasn't changed is checked again in seconds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('apps/api/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: just lint
      # The handlers' interfaces are generated from openapi.yaml: this fails when
      # the contract changed without `just gen`, or api.gen.go was edited by hand.
      - name: Generated code matches openapi.yaml
        run: |
          just gen
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: just test
      - run: just build
      # The known vulnerabilities the code reaches, in a module or in Go itself:
      # new ones are published all the time, so a change that passed may not now.
      - run: just vuln

  # A migration that's on main has run on databases that won't run it again:
  # a change to the schema adds a new one (apps/api/migrations/README.md).
  migrations:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for the base to compare with.
          fetch-depth: 0
      - run: scripts/check-migrations.sh "$BASE"
        env:
          # A pull request's base, or on a push to main what main was before it.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: bun just
      - run: bun install --frozen-lockfile
      - run: just lint
      # The same check for the api's types, src/api.gen.ts.
      - name: Generated code matches openapi.yaml
        run: |
          just gen
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: just test
      - run: just build

  # The whole stack in Docker and a browser against it, through the same recipe
  # as on a laptop. Independent of the jobs above, so it runs beside them.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: just
      - run: cp .env.example .env
      - run: just test-e2e
      - if: failure()
        run: docker compose logs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # The workflows, and Dependabot's config: actionlint checks they're valid,
  # zizmor that they're safe (injection, token permissions, pinned actions).
  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: just actionlint zizmor
      - run: just lint-workflows
        env:
          # For zizmor's audits that ask GitHub, such as whether each pinned
          # hash is a commit of its action's repository.
          GH_TOKEN: ${{ github.token }}
