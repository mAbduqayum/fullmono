# Checks every pull request, and every push to main before release.yml ships it.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # A monorepo's change usually touches one app: check only what changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - apps/api/**
              - .github/workflows/ci.yml
            web:
              - apps/web/**
              - .github/workflows/ci.yml
            e2e:
              - apps/**
              - e2e/**
              - compose.yaml
              - justfile
              - .github/workflows/ci.yml

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # A real Postgres beside the job, for the integration tests: they skip
    # without TEST_DATABASE_URL, so this one `go test` runs both kinds.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: apps/api
      - run: go test -race ./...
      - run: go build ./...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  # The whole stack in Docker and a browser against it, through the same recipe
  # as on a laptop. Independent of the jobs above, so it runs beside them.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - run: cp .env.example .env
      - run: just test-e2e
      - if: failure()
        run: docker compose logs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
