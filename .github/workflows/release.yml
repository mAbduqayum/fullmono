# Every push to main: check it (ci.yml), build both images and push them to
# GitHub's container registry, tagged with the commit's sha, then deploy them
# to the server (deploy.yml).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in push order: a newer one waits instead of racing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    # zizmor would have `$/` here, but a reusable workflow's `./` already runs
    # at this commit, and actionlint doesn't know `$/` yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes with git, so the token isn't left in .git/config,
          # where a later step or an uploaded artifact could read it.
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Registry names are lowercase, unlike the owner's GitHub name.
          images: ghcr.io/mabduqayum/fullmono-${{ matrix.app }}
          # The commit's full sha, which deploy pins, and latest.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layers from the last run: an unchanged app rebuilds in seconds.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    needs: images
    # deploy.yml checks this too, for its own "Run workflow"; here it skips the
    # call while the repository has no server.
    if: vars.DEPLOY_HOST != ''
    uses: ./.github/workflows/deploy.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ github.sha }}
    # Only the two it needs, not `secrets: inherit`, which would pass them all.
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
