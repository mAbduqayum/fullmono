# Dependabot opens a pull request when a dependency has a new version, and
# CI checks it like any other. Weekly, one grouped PR per ecosystem, and only
# for versions out at least two weeks (as bunfig.toml asks of bun install).
version: 2

updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      web:
        patterns: ["*"]

  # The FROM lines of both Dockerfiles, and the images compose runs.
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      compose:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
