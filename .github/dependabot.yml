# Dependabot opens a pull request when a dependency has a new version, and
# CI checks it like any other. Weekly, one grouped PR per ecosystem, and only
# for versions out at least two weeks (as bunfig.toml asks of bun install).
version: 2

updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: bun
    directories: [/apps/web, /e2e]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      js:
        patterns: ["*"]
    # @playwright/test and e2e/Dockerfile's image must name the same version,
    # which two pull requests (bun, docker) can't: bump both by hand, together.
    ignore:
      - dependency-name: "@playwright/test"

  # The FROM lines of both Dockerfiles, and the images compose runs.
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      compose:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
