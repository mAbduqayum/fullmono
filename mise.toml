# The tools the recipes, the git hooks and CI run, each at one version for
# everyone: `mise install` installs them, and with mise activated in your shell
# they're on PATH inside this folder. Docker is the one it can't install.
#
# Dependabot doesn't read this file: `mise outdated` lists newer versions.
# bun's must stay the packageManager in package.json and the Dockerfiles' tag.

# A mise that supports `lazy`, below.
min_version = "2026.10.3"

[tools]
go = "1.27.3"
bun = "1.4.3"
just = "1.58.0"
lefthook = "2.2.2"
golangci-lint = "2.14.0"
# Go from the api's SQL queries (`just gen`). Lazy, like the two below: only
# a change to a query or the schema needs it.
sqlc = { version = "1.31.1", lazy = true }
# The GitHub Actions workflows: actionlint checks they are valid, zizmor that
# they are safe (injection, token permissions, credentials left on disk).
# Lazy: only a change to .github needs them, so `mise install` skips them and
# the first run installs them (`mise install --include-lazy` installs them now).
actionlint = { version = "1.7.12", lazy = true }
zizmor = { version = "1.31.1", lazy = true }
